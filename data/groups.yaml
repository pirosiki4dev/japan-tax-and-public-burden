# 集計用グループ（schemas/groups.schema.json）。負担項目は data/burdens.yaml の各項目の groups で所属を示す。
# 法令上の名称ごとのグループは #143 の調査（surveys/first-release-scope/）で定義した。
# 集計方法は負担項目の登録時（#144〜#146）に、必要に応じて下位のグループを追加して定める。
groups:
  - group_id: national-tax
    name: 国税
    aggregation: classification
    description: 区分 nt の負担項目の分類
  - group_id: local-tax
    name: 地方税
    aggregation: classification
    description: 区分 lt の負担項目の分類
  - group_id: prefectural-tax
    name: 道府県税
    aggregation: classification
    parent_group_id: local-tax
    description: 地方税法第4条に列挙された道府県の法定税
  - group_id: municipal-tax
    name: 市町村税
    aggregation: classification
    parent_group_id: local-tax
    description: 地方税法第5条に列挙された市町村の法定税
  - group_id: social-insurance
    name: 社会保険料
    aggregation: classification
    description: 区分 si の負担項目の分類
  - group_id: income-tax
    name: 所得税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: corporation-tax
    name: 法人税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: local-corporation-tax
    name: 地方法人税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: special-corporate-enterprise-tax
    name: 特別法人事業税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: reconstruction-special-income-tax
    name: 復興特別所得税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: defense-special-corporation-tax
    name: 防衛特別法人税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: defense-special-income-tax
    name: 防衛特別所得税
    aggregation: classification
    parent_group_id: national-tax
    description: 令和八年法律第十二号で創設され、令和九年一月一日に施行される（#144 で追加。#143 の調査時点では施行前のため現行の条文になかった）
  - group_id: inheritance-tax
    name: 相続税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: gift-tax
    name: 贈与税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: consumption-tax
    name: 消費税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: liquor-tax
