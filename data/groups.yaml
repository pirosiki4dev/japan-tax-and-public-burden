    aggregation: classification
    parent_group_id: national-tax
  - group_id: tobacco-tax
    name: たばこ税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: tobacco-special-tax
    name: たばこ特別税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: gasoline-tax
    name: 揮発油税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: local-gasoline-tax
    name: 地方揮発油税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: petroleum-gas-tax
    name: 石油ガス税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: aviation-fuel-tax
    name: 航空機燃料税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: petroleum-and-coal-tax
    name: 石油石炭税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: power-development-promotion-tax
    name: 電源開発促進税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: motor-vehicle-tonnage-tax
    name: 自動車重量税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: stamp-tax
    name: 印紙税
    aggregation: classification
    parent_group_id: national-tax
  - group_id: registration-and-license-tax
    name: 登録免許税
    aggregation: classification
