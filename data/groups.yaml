  - group_id: golf-course-use-tax
    name: ゴルフ場利用税
    aggregation: classification
    parent_group_id: prefectural-tax
  - group_id: light-oil-delivery-tax
    name: 軽油引取税
    aggregation: classification
    parent_group_id: prefectural-tax
  - group_id: automobile-tax
    name: 自動車税
    aggregation: classification
    parent_group_id: prefectural-tax
  - group_id: mining-area-tax
    name: 鉱区税
    aggregation: classification
    parent_group_id: prefectural-tax
  - group_id: hunting-tax
    name: 狩猟税
    aggregation: classification
    parent_group_id: prefectural-tax
  - group_id: prefectural-water-utilization-and-land-benefit-tax
    name: 水利地益税（道府県）
    aggregation: classification
    parent_group_id: prefectural-tax
  - group_id: municipal-inhabitant-tax
    name: 市町村民税
    aggregation: classification
    parent_group_id: municipal-tax
  - group_id: fixed-assets-tax
    name: 固定資産税
    aggregation: classification
    parent_group_id: municipal-tax
  - group_id: light-motor-vehicle-tax
    name: 軽自動車税
    aggregation: classification
