# 集計用グループ（schemas/groups.schema.json）。負担項目は data/burdens.yaml の各項目の groups で所属を示す。
# 法令上の名称ごとのグループは #143 の調査（docs/surveys/first-release-scope/）で定義した。
# 集計方法は負担項目の登録時（#144〜#146）に、必要に応じて下位のグループを追加して定める。
groups:
  - group_id: national-tax
    name: 国税
    aggregation: classification
    description: 区分 nt の負担項目の分類
  - group_id: local-tax
    name: 地方税
    aggregation: classification
    description: 区分 lt の負担項目の分類
  - group_id: prefectural-tax
    name: 道府県税
    aggregation: classification
    parent_group_id: local-tax
    description: 地方税法第4条に列挙された道府県の法定税
  - group_id: municipal-tax
    name: 市町村税
    aggregation: classification
    parent_group_id: local-tax
    description: 地方税法第5条に列挙された市町村の法定税
  - group_id: social-insurance
    name: 社会保険料
    aggregation: classification
    description: 区分 si の負担項目の分類
