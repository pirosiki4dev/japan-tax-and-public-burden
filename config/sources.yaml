# 巡回する公式サイトの一覧（schemas/sources.schema.json）。
# 巡回URLはこのファイルだけに置き、プログラムへ直書きしない。
sources:
  - source_id: egov-law-api
    name: e-Gov法令API
    base_url: https://laws.e-gov.go.jp/api/2/
    rate_limit: 公式の利用条件に従い、多重リクエストを避ける
    request_interval_ms: 1000
    enabled: true
  - source_id: mhlw-employment-insurance-rate
    name: 厚生労働省「雇用保険料率について」（告示で変更される雇用保険率の公表）
    base_url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000108634.html
    rate_limit: 公式サイトの負荷を避け、1回の巡回でこのページと、本文に掲載された最新の資料（PDF）1件だけを、間隔を空けて取得する
    request_interval_ms: 1000
    enabled: true
